# Render's free plan puts the server to sleep after ~15 minutes without
# visitors, and the first player then waits up to a minute. This pings the
# health check every 10 minutes so the arena stays awake.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://dash-arena.onrender.com/api/health || true
