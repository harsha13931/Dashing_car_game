# Single free web service: builds the client and serves both the game
# website and the multiplayer (Socket.IO) server from one origin.
services:
  - type: web
    name: dash-arena
    env: node
    plan: free
    region: singapore          # change to a nearer region if you like
    buildCommand: npm install   # runs postinstall → installs client/server + builds client
    startCommand: npm start     # node server/index.js (serves client/dist + Socket.IO)
    autoDeploy: true
